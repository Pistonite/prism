[package]
name = "prism-cli"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/Pistonite/prism"
publish = false

[dependencies.prism-lib]
path = "../prism-lib"

[dependencies.prism-transpile]
path = "../prism-transpile"

[dependencies]
cu = { workspace = true, features = ["cli", "derive"] }
resvg = "0.47.0"
tiny-skia = "0.12.0"
usvg = "0.47.0"

[[bin]]
name = "prism"
path = "src/main.rs"

[package.metadata.binstall.signing]
algorithm = "minisign"
pubkey = "RWThJQKJaXayoZBe0YV5LV4KFkQwcqQ6Fg9dJBz18JnpHGdf/cHUyKs+"

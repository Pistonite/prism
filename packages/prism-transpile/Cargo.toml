[package]
name = "prism-transpile"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cu = { workspace = true, features = ["json"] }
swc.workspace = true
swc_common.workspace = true
swc_ecma_ast.workspace = true
swc_ecma_parser.workspace = true
swc_ecma_transforms_typescript.workspace = true

# Additional feature required by wasm
[target.'cfg(target_arch="wasm32")'.dependencies.getrandom]
version = "0.3.4"
optional = true

[features]
default = ["native"]
native = ["cu/fs"]
wasm = [
    "dep:getrandom",
    "getrandom/wasm_js",
]

[package]
name = "prism-lib"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cu = { workspace = true, features = ["parse", "derive"] }
serde.workspace = true
boa_engine = "0.21.0"
csscolorparser = { version = "0.8.2", features = ["serde"] }
num-traits = "0.2.19"
thiserror = "2.0.18"

# WASM stuff
tsify = { version = "0.5.6", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2.114", optional = true }

# # Additional feature required by WASM
# [dependencies.getrandom]
# package = "getrandom"
# version = "0.2.17"
# optional = true

[features]
wasm = [
    "dep:wasm-bindgen", 
    "dep:tsify", 
    # "dep:getrandom",
    # "getrandom/js",
    # "boa_engine/js"
]

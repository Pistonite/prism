[package]
name = "prism-lib"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
cu = { workspace = true, features = ["serde", "derive"] }
serde = "1"
boa_engine.workspace = true
csscolorparser = { workspace = true, features = ["serde"] }
num-traits.workspace = true
thiserror.workspace = true

# WASM stuff
tsify = { version = "0.5.6", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }

[features]
wasm = [
    "dep:wasm-bindgen", 
    "dep:tsify", 
]

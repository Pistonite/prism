[package]
name = "prism-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tsify = { version = "0.5.6", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.114"

[dependencies.prism-lib]
path = "../prism-lib"
features = ["wasm"]

[dependencies.prism-transpile]
path = "../prism-transpile"
features = ["wasm"]

[lib]
crate-type = ["cdylib"]


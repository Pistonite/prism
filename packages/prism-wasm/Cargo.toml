[package]
name = "prism-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
tsify = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true

[dependencies.prism-lib]
path = "../prism-lib"
features = ["wasm"]

[dependencies.prism-transpile]
path = "../prism-transpile"
default-features = false
features = ["wasm"]

[lib]
crate-type = ["cdylib"]


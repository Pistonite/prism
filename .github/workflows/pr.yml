name: PR
on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          mono-dev: false
          ecma-pnpm: true
          rust: stable
          rust-wasm: true
          tool-cargo-binstall: workex=Pistonite/workex
      - run: pnpm install
      - run: task post-install
      - run: task check
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          mono-dev: false
          ecma-pnpm: true
          rust: stable
          tool-cargo-binstall: workex=Pistonite/workex
      - run: pnpm install
      - run: task post-install
      - run: task test
  build-app:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: Pistonight/mono-dev/actions/setup@main
        with:
          mono-dev: false
          ecma-pnpm: true
          rust: stable
          rust-wasm: true
          tool-cargo-binstall: workex=Pistonite/workex
      - run: pnpm install
      - run: task post-install
      - run: task build-dev
